<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HandCash Connect</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1419; color: #e7ecf3; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; text-align: center; }
    p { margin: 0.5rem 0; max-width: 22rem; line-height: 1.5; }
    .err { color: #f87171; }
    a { color: #6ec3ff; }
  </style>
</head>
<body>
  <div>
    <p><strong>Returning to the demo…</strong></p>
    <p id="hint"></p>
  </div>
  <script>
    (function () {
      var token = new URLSearchParams(window.location.search).get("authToken") || "";
      token = String(token).trim();
      var hint = document.getElementById("hint");
      var origin = window.location.origin;
      if (!token) {
        hint.className = "err";
        hint.textContent = "Missing authToken. Check CONNECT_CALLBACK_URL in the HandCash dashboard.";
        return;
      }
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage({ type: "handcash-connect-auth", authToken: token }, origin); } catch (e) {}
        hint.textContent = "You can close this window.";
        setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
      } else {
        hint.innerHTML = "Copy <code>authToken</code> from the URL, or <a href=\"/\">open the demo</a>.";
      }
    })();
  </script>
</body>
</html>
